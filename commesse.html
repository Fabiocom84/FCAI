<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/variables.css?v=f997b938">
    <title>Gestione Commesse - Segretario AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Choices.js non serve piu' a questa pagina: lo usava solo il modale di
         creazione/modifica, rimosso il 06/09/2026. Resta sulle altre 10 pagine. -->


    <!-- Stili Custom -->
    <link rel="stylesheet" href="style-v2.css?v=f997b938">
    <link rel="stylesheet" href="commesse.css?v=f997b938">
</head>

<body class="internal-page">

    <div class="std-app-shell">
        <!-- HEADER -->
        <div class="std-app-header">
            <a href="index.html" class="std-btn std-btn--blue">
                <img src="img/log-out.png" alt="Home"
                    style="transform: rotate(180deg); filter: brightness(0) invert(1);">
                <span>Home</span>
            </a>
            <h1>GESTIONE COMMESSE</h1>
            <!-- Admin only: apre pagina nuova commessa -->
            <a href="nuova-commessa.html?tipo=COMPLETA&from=commesse"
               id="add-commessa-btn" class="std-btn std-btn--primary" style="display: none;">
                <span>+ Aggiungi</span>
            </a>
        </div>

        <!-- CONTENUTO SCROLLABILE -->
        <div class="std-app-content">
            <div class="commesse-view-wrapper">

                <!-- BARRA FILTRI (Sticky) -->
                <div class="controls-container">
                    <div class="filters-group">
                        <span class="filter-label">Stato:</span>
                        <button class="filter-btn active" data-filter="In Lavorazione">In Lavorazione</button>
                        <button class="filter-btn" data-filter="Completato">Completato</button>
                        <button class="filter-btn" data-filter="">Tutte</button>
                    </div>
                    <!-- Filtro Tipo: visibile solo ad admin/impiegato (nascosto di default, mostrato via JS) -->
                    <div class="filters-group tipo-filters" id="tipoFiltersGroup" style="display:none;">
                        <span class="filter-label">Tipo:</span>
                        <button class="filter-btn filter-tipo active" data-tipo="ALL">Tutte</button>
                        <button class="filter-btn filter-tipo" data-tipo="COMPLETA">Commesse</button>
                        <button class="filter-btn filter-tipo manutenzioni-tipo-btn" data-tipo="MANUTENZIONE">🔧 Manutenzioni</button>
                    </div>

                    <div class="search-group">
                        <input type="text" id="search-input" placeholder="Cerca cliente, impianto, matricola...">

                        <label id="deep-search-wrapper" title="Cerca anche dentro le registrazioni (più lento)">
                            <input type="checkbox" id="search-deep"> Reg.
                        </label>

                        <select id="sort-select">
                            <option value="data_commessa:desc">Più Recenti</option>
                            <option value="data_commessa:asc">Meno Recenti</option>
                            <option value="cliente:asc">Alfabetico (Cliente)</option>
                        </select>
                        <button id="btn-open-geomap" class="std-btn std-btn--secondary"
                            title="Mappa Interattiva Commesse" style="margin-left: 10px;">
                            <span>🌍 GeoMap</span>
                        </button>
                    </div>
                </div>

                <!-- GRIGLIA CARD -->
                <div id="commesse-grid" class="commesse-grid">
                <!-- Skeleton Loader (mostrato durante il caricamento) -->
                    <div id="loader" class="loader skeleton-grid">
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line-grid"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-line w100" style="height:6px;margin-top:8px"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line-grid"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-line w100" style="height:6px;margin-top:8px"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line-grid"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-line w100" style="height:6px;margin-top:8px"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line-grid"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-line w100" style="height:6px;margin-top:8px"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line-grid"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-line w100" style="height:6px;margin-top:8px"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line-grid"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-line w100" style="height:6px;margin-top:8px"></div></div></div>
                    </div>
                </div>

                <!-- LOADER SCROLL INFINITO (Nascosto di default) -->
                <div id="infinite-scroll-loader" class="scroll-loader">
                    <div class="spinner-small"></div>
                    <span>Caricamento altre commesse...</span>
                </div>

                <!-- Spacer finale per evitare che il contenuto sia coperto -->
                <div style="height: 40px;"></div>
            </div>
        </div>
    </div>

    <!-- Sovrapposizione condivisa: la usa showModal di shared-ui.js -->
    <div id="modalOverlay" class="modal-overlay"></div>


    <!-- CUSTOM CONFIRM MODAL (SHARED UI) -->
    <div id="universal-modal-overlay" class="universal-modal-overlay" style="display: none;">
        <div id="universal-modal" class="universal-modal">
            <h3 id="universal-modal-title">Titolo</h3>
            <p id="universal-modal-message">Messaggio...</p>
            <div id="universal-modal-buttons" class="universal-modal-buttons">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>
    </div>



    <!-- GEO MAP MODAL -->
    <div id="geoMapModalOverlay" class="modal-overlay" style="z-index: 9000; display: none;"></div>
    <div id="geoMapModal" class="commessa-modal-container"
        style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9001; width: 95vw; height: 90vh; display: none; background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <div class="modal-content" style="height: 100%; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3>🌍 Mappa Commesse</h3>
                <div id="geomap-mobile-toggles" class="mobile-toggles">
                    <button id="btn-show-map" class="toggle-btn active">Mappa</button>
                    <button id="btn-show-list" class="toggle-btn">Lista</button>
                </div>
                <button type="button" id="closeGeoMapBtn" class="std-btn std-btn--secondary">Chiudi</button>
            </div>
            <div class="modal-body" style="flex: 1; padding: 0; display: flex; overflow: hidden;">
                <!-- Sidebar Filtri -->
                <!-- L'aspetto sta in commesse.css (.geomap-sidebar). Rimettere qui un
                     `display` inline rompe il commutatore Mappa/Lista su mobile. -->
                <div class="geomap-sidebar">
                    <div style="padding: 15px; border-bottom: 1px solid #ddd;">
                        <input type="text" id="geomap-search-labels" placeholder="Filtra impianti..."
                            style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                    <div id="geomap-labels-list" style="flex: 1; overflow-y: auto; padding: 10px;">
                        <!-- Checkboxes will be injected here -->
                    </div>
                </div>
                <!-- Mappa -->
                <div id="geoMapFullContainer" style="flex: 1; height: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- IMAGE LIGHTBOX MODAL -->
    <div id="imageViewerModal" class="image-viewer-modal" style="display: none;">
        <span class="close-viewer">&times;</span>
        <img class="viewer-content" id="fullImage">
    </div>

    <!-- Script caricati come moduli -->
    <!-- Leaflet JS -->
    <!-- Leaflet JS spostato in locale o in head se preferisci, ma qui rimuoviamo la CDN -->

    <!-- Solo i punti d'ingresso: gli altri moduli arrivano tramite `import`.
         Fino al 06/09/2026 qui c'erano anche i tag di config.js, api-client.js e
         shared-ui.js, che quei moduli importano gia'. Tag e import sono URL
         DIVERSI (`js/x.js?v=N` contro `./x.js`), quindi il browser caricava ed
         eseguiva due istanze separate dello stesso modulo — config.js tre volte.
         Era inerte per tre motivi accidentali, non progettati. -->
    <script type="module" src="js/auth-guard.js?v=07bb4987"></script>
    <script type="module" src="js/commesse.js?v=07bb4987"></script>
</body>

</html>
