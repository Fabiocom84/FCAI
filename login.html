<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/variables.css?v=f997b938">
    <title>Login - Segretario AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-v2.css?v=f997b938">
</head>

<body>
    <div class="login-page-content">
        <div class="login-container">
            <img src="img/logo.png" alt="Logo" class="login-logo">
            <h2>Accedi al Segretario AI</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" name="password" required>
                        <img src="img/eye.png" alt="Mostra password" id="togglePassword" class="toggle-password">
                    </div>
                </div>
                <button type="submit">Accedi</button>
                <div id="errorMessage" class="error-message" style="display: none;">Credenziali errate.</div>
            </form>
        </div>
    </div>

    <!-- Solo i punti d'ingresso: gli altri moduli arrivano tramite `import`.
         Fino al 06/09/2026 qui c'erano anche i tag di config.js, api-client.js e
         shared-ui.js, che quei moduli importano gia'. Tag e import sono URL
         DIVERSI (`js/x.js?v=N` contro `./x.js`), quindi il browser caricava ed
         eseguiva due istanze separate dello stesso modulo — config.js tre volte.
         Era inerte per tre motivi accidentali, non progettati. -->
    <script type="module" src="js/login.js?v=7790a6d9"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>

</html>
